<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOFOX Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   Notion-style Design Tokens
   ═══════════════════════════════════════════ */
:root {
  --primary: #2383e2;
  --brand-navy: #191919;
  --brand-navy-mid: #2b2b2b;
  --brand-pink: #e255a1;
  --brand-orange: #e07839;
  --brand-purple: #9065e0;
  --brand-teal: #2eaadc;
  --brand-green: #4dab5c;
  --tint-yellow-bold: #f5c518;
  --tint-mint: #e0f5ed;
  --tint-lavender: #ede4f7;
  --tint-peach: #fdeae1;
  --tint-gray: #f1f1ef;
  --canvas: #ffffff;
  --surface: #f7f6f3;
  --surface-soft: #fafaf8;
  --hairline: #e9e9e7;
  --hairline-soft: #f0f0ee;
  --hairline-strong: #d3d3d0;
  --ink-deep: #0f0f0f;
  --ink: #1a1a1a;
  --charcoal: #37352f;
  --slate: #6b6b6b;
  --steel: #9b9a97;
  --stone: #afafad;
  --on-dark: #ffffff;
  --on-dark-muted: rgba(255,255,255,0.65);
  --success: #2ecc71;
  --warning: #e67e22;
  --error: #e74c3c;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
  --shadow-card: rgba(15,15,15,0.08) 0px 4px 12px 0px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', Helvetica, sans-serif;
  background: var(--surface);
  color: var(--charcoal);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

/* ═══ Hero ═══ */
.hero {
  background: var(--brand-navy);
  color: var(--on-dark);
  padding: 64px 0 48px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 24px; right: 80px;
  width: 12px; height: 12px;
  background: var(--brand-pink);
  border-radius: var(--r-full);
  box-shadow:
    -40px 30px 0 var(--brand-teal),
    -120px -10px 0 var(--tint-yellow-bold),
    60px 60px 0 var(--brand-purple),
    -200px 50px 0 var(--brand-green),
    120px -20px 0 var(--brand-orange);
}
.hero-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px;
  text-align: center;
}
.hero h1 { font-size: 56px; font-weight: 600; line-height: 1.10; letter-spacing: -1px; margin-bottom: 12px; }
.hero .subtitle { font-size: 18px; font-weight: 400; line-height: 1.50; color: var(--on-dark-muted); margin-bottom: 8px; }
.hero .date-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-full);
  padding: 6px 16px;
  font-size: 13px; font-weight: 600; color: var(--on-dark-muted);
  margin-bottom: 24px;
}
.hero .date-badge .dot {
  width: 8px; height: 8px; border-radius: var(--r-full);
  background: var(--success); animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ═══ Summary KPI ═══ */
.summary-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-top: -40px; position: relative; z-index: 2; margin-bottom: 40px;
}
.summary-card {
  background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); padding: 24px;
  box-shadow: var(--shadow-card); text-align: center;
}
.summary-card .label {
  font-size: 13px; font-weight: 600; color: var(--steel);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
}
.summary-card .value { font-size: 36px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.summary-card .sub { font-size: 13px; color: var(--slate); margin-top: 4px; }
.summary-card .value.green { color: var(--success); }
.summary-card .value.orange { color: var(--warning); }
.summary-card .value.red { color: var(--error); }

/* ═══ Section ═══ */
.section-title {
  font-size: 22px; font-weight: 600; color: var(--ink);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

/* ═══ WS Table ═══ */
.ws-table-wrap {
  background: var(--canvas); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-card); margin-bottom: 40px;
}
.ws-table { width: 100%; border-collapse: collapse; }
.ws-table thead th {
  background: var(--surface); padding: 12px 16px;
  font-size: 12px; font-weight: 600; color: var(--steel);
  text-transform: uppercase; letter-spacing: 0.5px;
  text-align: left; border-bottom: 1px solid var(--hairline);
}
.ws-table tbody td {
  padding: 14px 16px; font-size: 14px;
  border-bottom: 1px solid var(--hairline-soft); vertical-align: middle;
}
.ws-table tbody tr:last-child td { border-bottom: none; }
.ws-table tbody tr:hover { background: var(--surface-soft); }
.ws-table tbody tr.ws-row { cursor: pointer; }
.ws-table tbody tr.ws-row td:first-child .ws-name::before { content: '▶ '; font-size: 10px; color: var(--stone); transition: transform .2s; display: inline-block; }
.ws-table tbody tr.ws-row.open td:first-child .ws-name::before { content: '▼ '; color: var(--primary); }
.ws-detail-row td { padding: 0 !important; border-bottom: 1px solid var(--hairline-soft) !important; }
.ws-detail { background: var(--surface-soft); padding: 12px 20px 16px 48px; }
.ws-detail-empty { color: var(--steel); font-size: 13px; padding: 8px 0; }
.parent-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; border-bottom: 1px solid var(--hairline-soft); }
.parent-row:last-child { border-bottom: none; }
.parent-arrow { font-size: 10px; color: var(--stone); width: 14px; flex-shrink: 0; transition: transform .15s; }
.parent-row.open .parent-arrow { color: var(--primary); }
.parent-title { font-size: 13px; font-weight: 500; color: var(--ink); flex: 1; }
.parent-id { font-size: 11px; color: var(--stone); font-family: monospace; }
.parent-status { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-full); }
.parent-status-todo { background: var(--tint-gray); color: var(--slate); }
.parent-status-in_progress { background: #e0edff; color: #1a5fa0; }
.parent-status-done { background: #e6f9ee; color: #1a7a3a; }
.parent-dots { display: flex; gap: 3px; align-items: center; }
.parent-dots .dot-mini { width: 8px; height: 8px; border-radius: var(--r-full); }
.dot-done { background: var(--success); }
.dot-in_progress { background: var(--primary); }
.dot-todo { background: var(--hairline-strong); }
.sub-list { padding: 4px 0 4px 22px; display: none; }
.parent-row.open + .sub-list { display: block; }
.sub-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: var(--slate); }
.sub-item .sub-dot { width: 6px; height: 6px; border-radius: var(--r-full); flex-shrink: 0; }
.sub-item .sub-title { flex: 1; }
.sub-item .sub-id { font-size: 10px; color: var(--stone); font-family: monospace; }
.sub-item .sub-status { font-size: 10px; font-weight: 600; }
.sub-item .sub-due { font-size: 10px; color: var(--stone); }

.ws-name { font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 600;
}
.status-badge .dot { width: 8px; height: 8px; border-radius: var(--r-full); }
.status-on_track { background: #e6f9ee; color: #1a7a3a; }
.status-on_track .dot { background: var(--success); }
.status-at_risk { background: #fef3e2; color: #9a5b13; }
.status-at_risk .dot { background: var(--warning); }
.status-blocked { background: #fce4e4; color: #a0232a; }
.status-blocked .dot { background: var(--error); }
.status-not_started { background: var(--tint-gray); color: var(--slate); }
.status-not_started .dot { background: var(--stone); }

.progress-bar-wrap { display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; height: 6px; background: var(--hairline); border-radius: var(--r-full); overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: var(--r-full); transition: width 0.3s ease; }
.fill-on_track { background: var(--success); }
.fill-at_risk { background: var(--warning); }
.fill-blocked { background: var(--error); }
.fill-not_started { background: var(--stone); }
.progress-pct { font-size: 13px; font-weight: 600; color: var(--slate); min-width: 36px; text-align: right; }

.driver-tag {
  font-size: 12px; font-weight: 500; padding: 2px 8px;
  border-radius: var(--r-sm); background: var(--tint-lavender); color: #6b4fa0;
  display: inline-block; margin-right: 4px;
}
.driver-tag.external { background: var(--tint-peach); color: #9a5b13; }
.issue-text { font-size: 13px; color: var(--slate); }

/* ═══ Two col ═══ */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }

/* ═══ Blockers ═══ */
.blockers-card {
  background: #fff8e1; border: 1px solid #f0e0a0;
  border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-card);
}
.blocker-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
.blocker-item:last-child { border-bottom: none; }
.blocker-num {
  width: 24px; height: 24px; background: var(--warning); color: white;
  border-radius: var(--r-full); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.blocker-text { font-size: 14px; color: var(--charcoal); line-height: 1.5; }
.blocker-text .ws-ref { font-weight: 600; color: var(--brand-orange); }

/* ═══ Milestones ═══ */
.milestones-card {
  background: var(--tint-mint); border: 1px solid #b8e6d0;
  border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-card);
}
.milestone-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
.milestone-check {
  width: 20px; height: 20px; border: 2px solid var(--brand-green);
  border-radius: var(--r-xs); flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--brand-green);
}
.milestone-check.done { background: var(--brand-green); color: white; }
.milestone-text { font-size: 14px; color: var(--charcoal); line-height: 1.5; }

/* ═══ PM Comment ═══ */
.pm-comment {
  background: var(--brand-navy-mid); color: var(--on-dark);
  border-radius: var(--r-lg); padding: 24px 32px; margin-bottom: 40px;
  display: flex; align-items: flex-start; gap: 16px; box-shadow: var(--shadow-card);
}
.pm-avatar {
  width: 40px; height: 40px; border-radius: var(--r-full);
  background: var(--brand-purple); display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; flex-shrink: 0;
}
.pm-comment-body { flex: 1; }
.pm-comment-body .pm-name { font-size: 13px; font-weight: 600; color: var(--on-dark-muted); margin-bottom: 4px; }
.pm-comment-body .pm-text { font-size: 16px; font-weight: 400; line-height: 1.55; }

/* ═══ Loading ═══ */
.loading {
  text-align: center; padding: 80px 0; font-size: 16px; color: var(--steel);
}
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid var(--hairline);
  border-top-color: var(--primary); border-radius: var(--r-full);
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══ Footer ═══ */
.footer { text-align: center; padding: 32px 0 48px; font-size: 12px; color: var(--steel); }

/* Shared Items */
.shared-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.shared-card.decided{opacity:0.5}
.shared-header{display:flex;align-items:flex-start;gap:10px}
.shared-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);flex-shrink:0;margin-top:2px}
.shared-tag-info{background:var(--tint-sky);color:#1a5fa0}
.shared-tag-decision{background:#fce4e4;color:#a0232a}
.shared-content{flex:1;font-size:14px;color:var(--charcoal);line-height:1.55}
.shared-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.shared-btn{padding:6px 14px;border-radius:var(--r-md);font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.shared-btn-ack{background:var(--ink-deep);color:var(--on-dark)}
.shared-btn-ack:hover{background:#333}
.shared-btn-del{background:transparent;color:var(--stone);border:1px solid var(--hairline-strong);font-size:11px;padding:4px 10px}
.shared-btn-del:hover{background:#fce4e4;color:#a0232a;border-color:#e8a0a0}
.shared-btn-ack.done{background:var(--success);cursor:default}
.shared-input{flex:1;padding:6px 10px;border:1px solid var(--hairline-strong);border-radius:var(--r-md);font-size:12px;font-family:inherit;color:var(--ink);outline:none}
.shared-input:focus{border-color:var(--primary)}
.shared-response{margin-top:8px;padding:8px 12px;background:var(--surface);border-radius:var(--r-md);font-size:13px;color:var(--slate);border-left:3px solid var(--primary)}
.shared-time{font-size:11px;color:var(--stone);margin-top:6px}

/* ═══ Responsive ═══ */
@media (max-width: 1023px) {
  .hero h1 { font-size: 40px; }
  .summary-strip { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
  .hero h1 { font-size: 32px; }
  .summary-strip { grid-template-columns: 1fr; }
  .page { padding: 0 16px; }
  .hero-inner { padding: 0 16px; }
  .ws-table-wrap { overflow-x: auto; }
  .ws-table { min-width: 700px; }
}
</style>
</head>

<!-- Content -->
<div class="page">

  <!-- KPI Strip -->
  <div class="summary-strip" id="kpi-strip">

<script>
// ═══════════════════════════════════════════
// Supabase Config
// ═══════════════════════════════════════════
const SUPABASE_URL = 'https://ldqvreaivjrvrvpitcqx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcXZyZWFpdmpydnJ2cGl0Y3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyOTEzMDYsImV4cCI6MjA3Njg2NzMwNn0.GMpmq4tal4kvcW6_P_LOxCWc8XrVh6LX51sQ2L5WyEQ';

async function supaFetch(table, query = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    }
  });
  if (!res.ok) throw new Error(`${table}: ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════
// Renderers
// ═══════════════════════════════════════════

function renderKPI(metrics) {
  const strip = document.getElementById('kpi-strip');
  metrics.sort((a, b) => a.sort_order - b.sort_order);
  strip.innerHTML = metrics.map(m => `
    <div class="summary-card">
      <div class="label">${esc(m.label)}</div>
      <div class="value ${esc(m.color)}">${esc(m.value)}</div>
      <div class="sub">${esc(m.sub_text)}</div>
    </div>
  `).join('');
}

function renderWS(rows) {
  const tbody = document.getElementById('ws-tbody');
  rows.sort((a, b) => a.id - b.id);
  tbody.innerHTML = rows.map(ws => {
    const drivers = ws.driver.split('+').map(d => {
      const trimmed = d.trim();
      const isExt = ws.driver_type === 'external' || ['대행사', '광원', '지환'].includes(trimmed);
      return `<span class="driver-tag${isExt ? ' external' : ''}">${esc(trimmed)}</span>`;
    }).join('');

    return `
      <tr class="ws-row" onclick="toggleWsDetail(this, ${ws.id})">
        <td><span class="ws-name"><span class="ws-icon">${ws.icon}</span> ${esc(ws.name)}</span></td>
        <td><span class="status-badge status-${ws.status}"><span class="dot"></span>${esc(ws.status_label)}</span></td>
        <td>
          <div class="progress-bar-wrap">
            <div class="progress-bar"><div class="fill fill-${ws.status}" style="width:${ws.progress}%"></div></div>
            <span class="progress-pct">${ws.progress}%</span>
          </div>
        </td>
        <td>${drivers}</td>
        <td><span class="issue-text">${esc(ws.issue_text)}</span></td>
      </tr>
      <tr class="ws-detail-row" id="ws-detail-${ws.id}" style="display:none">
        <td colspan="5">
          <div class="ws-detail" id="ws-detail-content-${ws.id}">
            <div class="ws-detail-empty">로딩중...</div>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// WS detail cache
const wsDetailCache = {};

async function toggleWsDetail(row, wsId) {
  const detailRow = document.getElementById('ws-detail-' + wsId);
  const isOpen = row.classList.contains('open');

  // Close all other open details
  document.querySelectorAll('.ws-row.open').forEach(r => {
    if (r !== row) {
      r.classList.remove('open');
      const otherId = r.getAttribute('onclick').match(/(\d+)/)?.[1];
      if (otherId) document.getElementById('ws-detail-' + otherId).style.display = 'none';
    }
  });

  if (isOpen) {
    row.classList.remove('open');
    detailRow.style.display = 'none';
    return;
  }

  row.classList.add('open');
  detailRow.style.display = '';

  // Fetch if not cached
  if (!wsDetailCache[wsId]) {
    const actions = await supaFetch('dashboard_actions', `?ws_id=eq.${wsId}&order=is_sub,parent_issue_id,id`);
    wsDetailCache[wsId] = actions;
  }
  renderWsDetail(wsId, wsDetailCache[wsId]);
}

function renderWsDetail(wsId, actions) {
  const container = document.getElementById('ws-detail-content-' + wsId);
  const parents = actions.filter(a => !a.is_sub);
  const subs = actions.filter(a => a.is_sub);

  if (parents.length === 0) {
    container.innerHTML = '<div class="ws-detail-empty">이슈 없음</div>';
    return;
  }

  container.innerHTML = parents.map(p => {
    const children = subs.filter(s => s.parent_issue_id === p.linear_issue_id);
    const doneCount = children.filter(c => c.status === 'done').length;
    const dots = children.map(c =>
      `<span class="dot-mini dot-${c.status}"></span>`
    ).join('');

    const subHtml = children.length > 0
      ? children.map(s => {
          const statusColor = s.status === 'done' ? 'var(--success)' : s.status === 'in_progress' ? 'var(--primary)' : 'var(--hairline-strong)';
          const statusLabel = s.status === 'done' ? '완료' : s.status === 'in_progress' ? '진행중' : 'Todo';
          const due = s.due_date ? s.due_date.slice(5) : '';
          return `<div class="sub-item">
            <span class="sub-dot" style="background:${statusColor}"></span>
            <span class="sub-title">${esc(s.title)}</span>
            <span class="sub-status" style="color:${statusColor}">${statusLabel}</span>
            <span class="sub-due">${due}</span>
            <span class="sub-id">${esc(s.linear_issue_id)}</span>
          </div>`;
        }).join('')
      : '<div class="sub-item" style="color:var(--stone)">sub-issue 없음</div>';

    const statusCls = p.status === 'done' ? 'done' : p.status === 'in_progress' ? 'in_progress' : 'todo';
    const statusLabel = p.status === 'done' ? '완료' : p.status === 'in_progress' ? '진행중' : 'Todo';

    return `
      <div class="parent-row" onclick="this.classList.toggle('open')">
        <span class="parent-arrow">▶</span>
        <span class="parent-title">${esc(p.title)}</span>
        <span class="parent-dots">${dots}</span>
        <span class="parent-status parent-status-${statusCls}">${statusLabel}</span>
        <span class="parent-id">${esc(p.linear_issue_id)}</span>
        <span style="font-size:11px;color:var(--stone)">${doneCount}/${children.length}</span>
      </div>
      <div class="sub-list">${subHtml}</div>
    `;
  }).join('');
}

function renderBlockers(blockers) {
  const card = document.getElementById('blockers-card');
  const active = blockers.filter(b => !b.resolved);
  active.sort((a, b) => a.rank - b.rank);
  if (active.length === 0) {
    card.innerHTML = '<div style="padding:16px;text-align:center;color:var(--steel);">🎉 블로커 없음!</div>';
    return;
  }
  card.innerHTML = active.map(b => `
    <div class="blocker-item">
      <span class="blocker-num">${b.rank}</span>
      <span class="blocker-text"><span class="ws-ref">${esc(b.ws_ref)}</span> — ${esc(b.description)}</span>
    </div>
  `).join('');
}

function renderSnapshot(snapshot) {
  const milCard = document.getElementById('milestones-card');
  const pmComment = document.getElementById('pm-comment');

  if (!snapshot) {
    milCard.innerHTML = '<div style="padding:16px;text-align:center;color:var(--steel);">스냅샷 없음</div>';
    return;
  }

  const milestones = snapshot.milestones || [];
  milCard.innerHTML = milestones.map(m => `
    <div class="milestone-item">
      <span class="milestone-check${m.done ? ' done' : ''}">${m.done ? '✓' : '—'}</span>
      <span class="milestone-text">${esc(m.text)}</span>
    </div>
  `).join('');

  if (snapshot.pm_comment) {
    pmComment.style.display = 'flex';
    document.getElementById('pm-name').textContent = `${snapshot.pm_name} · 주간 코멘트`;
    document.getElementById('pm-text').textContent = snapshot.pm_comment;
  }
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) 기준`;
}

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════
async function init() {
  try {
    const [kpis, ws, blockers, snapshots] = await Promise.all([
      supaFetch('dashboard_kpi_metrics', '?order=sort_order'),
      supaFetch('dashboard_ws_status', '?order=id'),
      supaFetch('dashboard_blockers', '?order=rank'),
      supaFetch('dashboard_weekly_snapshot', '?order=week_start.desc&limit=1'),
    ]);

    renderKPI(kpis);
    renderWS(ws);
    renderBlockers(blockers);
    renderSnapshot(snapshots[0] || null);

    // Shared items
    const shared = await supaFetch('dashboard_shared_items', '?order=created_at.desc');
    renderShared(shared);

    // Update date
    const now = new Date();
    document.getElementById('hero-date').textContent = formatDate(now);
    document.getElementById('footer').textContent =
      `BIOFOX Marketing · Last updated: ${now.toISOString().slice(0,16).replace('T',' ')} · PM: eonwoo yoo`;

  } catch (err) {
    console.error('Dashboard load failed:', err);
    document.getElementById('kpi-strip').innerHTML =
      `<div class="loading" style="grid-column:1/-1;color:var(--error);">❌ 데이터 로드 실패: ${esc(err.message)}</div>`;
  }
}

init();

// ═══ Shared Items ═══
function renderShared(items) {
  const el = document.getElementById('shared-items');
  if (!items || items.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--steel);font-size:14px">공유 사항 없음</div>';
    return;
  }
  // Unacknowledged first
  items.sort((a,b) => (a.acknowledged?1:0) - (b.acknowledged?1:0));

  el.innerHTML = items.map(item => {
    const tag = item.is_decision
      ? '<span class="shared-tag shared-tag-decision">의사결정 요청</span>'
      : '<span class="shared-tag shared-tag-info">공유</span>';

    const ackBtn = item.acknowledged
      ? '<span class="shared-btn shared-btn-ack done">✓ 확인됨</span>'
      : `<button class="shared-btn shared-btn-ack" onclick="ackItem(${item.id}, this)">확인</button>`;

    const responseArea = item.is_decision
      ? (item.response
        ? `<div class="shared-response">💬 ${esc(item.response)}</div>`
        : (item.acknowledged
          ? ''
          : `<div class="shared-actions">
              <input class="shared-input" id="resp-${item.id}" placeholder="의견을 입력해주세요..." onkeydown="if(event.key==='Enter')submitResp(${item.id})"/>
              <button class="shared-btn" style="background:var(--primary);color:white" onclick="submitResp(${item.id})">전송</button>
            </div>`))
      : '';

    const timeStr = item.acknowledged_at
      ? `<div class="shared-time">✓ ${new Date(item.acknowledged_at).toLocaleString('ko-KR')}</div>`
      : '';

    return `<div class="shared-card${item.acknowledged?' decided':''}" id="shared-${item.id}">
      <div class="shared-header">
        ${tag}
        <div class="shared-content">${esc(item.content)}</div>
        ${ackBtn}
        <button class="shared-btn shared-btn-del" onclick="deleteItem(${item.id}, this)" title="삭제">🗑</button>
      </div>
      ${responseArea}
      ${timeStr}
    </div>`;
  }).join('');
}

async function ackItem(id, btn) {
  btn.textContent = '...';
  btn.disabled = true;
  await fetch(`${SUPABASE_URL}/rest/v1/dashboard_shared_items?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ acknowledged: true, acknowledged_at: new Date().toISOString() })
  });
  btn.textContent = '✓ 확인됨';
  btn.classList.add('done');
  btn.closest('.shared-card').classList.add('decided');
}

async function submitResp(id) {
  const input = document.getElementById('resp-'+id);
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;

  await fetch(`${SUPABASE_URL}/rest/v1/dashboard_shared_items?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({ response: text, acknowledged: true, acknowledged_at: new Date().toISOString() })
  });

  // Re-render
  const shared = await supaFetch('dashboard_shared_items', '?order=created_at.desc');
  renderShared(shared);
}

async function deleteItem(id, btn) {
  if (!confirm('삭제하시겠습니까?')) return;
  btn.textContent = '...';
  btn.disabled = true;
  await fetch(`${SUPABASE_URL}/rest/v1/dashboard_shared_items?id=eq.${id}`, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  const card = document.getElementById('shared-'+id);
  if (card) {
    card.style.transition = 'all .3s ease';
    card.style.opacity = '0';
    card.style.transform = 'translateX(20px)';
    setTimeout(() => card.remove(), 300);
  }
}
</script>
