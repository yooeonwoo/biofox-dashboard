<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOFOX PM Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2383e2; --brand-navy: #191919; --brand-navy-mid: #2b2b2b;
  --brand-pink: #e255a1; --brand-orange: #e07839; --brand-purple: #9065e0;
  --brand-teal: #2eaadc; --brand-green: #4dab5c; --tint-yellow-bold: #f5c518;
  --tint-mint: #e0f5ed; --tint-lavender: #ede4f7; --tint-peach: #fdeae1;
  --tint-sky: #dbeafe; --tint-gray: #f1f1ef; --tint-rose: #fce4ec;
  --canvas: #ffffff; --surface: #f7f6f3; --surface-soft: #fafaf8;
  --hairline: #e9e9e7; --hairline-soft: #f0f0ee; --hairline-strong: #d3d3d0;
  --ink-deep: #0f0f0f; --ink: #1a1a1a; --charcoal: #37352f;
  --slate: #6b6b6b; --steel: #9b9a97; --stone: #afafad;
  --on-dark: #ffffff; --on-dark-muted: rgba(255,255,255,0.65);
  --success: #2ecc71; --warning: #e67e22; --error: #e74c3c;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
  --shadow-card: rgba(15,15,15,0.08) 0px 4px 12px 0px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--surface); color: var(--charcoal); line-height: 1.55; -webkit-font-smoothing: antialiased; }
.page { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ═══ Hero ═══ */
.hero { background: var(--brand-navy-mid); color: var(--on-dark); padding: 48px 0 40px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: 16px; right: 60px; width: 10px; height: 10px; background: var(--brand-teal); border-radius: var(--r-full); box-shadow: -30px 20px 0 var(--brand-pink), -80px -5px 0 var(--tint-yellow-bold), 50px 40px 0 var(--brand-purple), 100px -15px 0 var(--brand-green); }
.hero-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
.hero h1 { font-size: 36px; font-weight: 600; line-height: 1.15; letter-spacing: -0.5px; }
.hero .subtitle { font-size: 14px; color: var(--on-dark-muted); margin-top: 4px; }
.hero-nav { display: flex; gap: 8px; }
.hero-nav a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; color: var(--on-dark); border: 1px solid rgba(255,255,255,0.15); transition: background 0.15s; }
.hero-nav a:hover { background: rgba(255,255,255,0.08); text-decoration: none; }
.hero-nav a.active { background: var(--primary); border-color: var(--primary); }

/* ═══ Section Title ═══ */
.section-title { font-size: 20px; font-weight: 600; color: var(--ink); margin: 32px 0 12px; display: flex; align-items: center; gap: 8px; }

/* ═══ Cards ═══ */
.card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-card); margin-bottom: 24px; overflow: hidden; }

/* ═══ Actions Table ═══ */
.actions-table { width: 100%; border-collapse: collapse; }
.actions-table thead th { background: var(--surface); padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--steel); text-transform: uppercase; letter-spacing: 0.5px; text-align: left; border-bottom: 1px solid var(--hairline); }
.actions-table tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; }
.actions-table tbody tr:last-child td { border-bottom: none; }
.actions-table tbody tr:hover { background: var(--surface-soft); }

/* ═══ Badges ═══ */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-full); font-size: 11px; font-weight: 600; }
.badge-todo { background: var(--tint-gray); color: var(--slate); }
.badge-in_progress { background: var(--tint-sky); color: #1a5fa0; }
.badge-done { background: #e6f9ee; color: #1a7a3a; }
.badge-blocked { background: #fce4e4; color: #a0232a; }

.priority-dot { width: 8px; height: 8px; border-radius: var(--r-full); display: inline-block; }
.priority-1 { background: var(--error); }
.priority-2 { background: var(--warning); }
.priority-3 { background: var(--primary); }
.priority-4 { background: var(--stone); }

.ws-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--r-sm); display: inline-block; }
.ws-1 { background: #fce4e4; color: #a0232a; }
.ws-2 { background: var(--tint-mint); color: #1a7a3a; }
.ws-3 { background: var(--tint-lavender); color: #6b4fa0; }
.ws-4 { background: var(--tint-rose); color: #9a3055; }
.ws-5 { background: var(--tint-sky); color: #1a5fa0; }
.ws-6 { background: var(--tint-peach); color: #9a5b13; }
.ws-7 { background: var(--tint-gray); color: var(--slate); }
.ws-8 { background: #fef9e7; color: #8a6d00; }

.due-overdue { color: var(--error); font-weight: 600; }
.due-soon { color: var(--warning); font-weight: 500; }
.due-ok { color: var(--slate); }

/* ═══ Team Load ═══ */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 20px; }
.team-card { padding: 16px; border: 1px solid var(--hairline); border-radius: var(--r-md); }
.team-name { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.team-bar-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.team-bar { flex: 1; height: 8px; background: var(--hairline); border-radius: var(--r-full); overflow: hidden; display: flex; }
.team-bar .seg { height: 100%; }
.seg-done { background: var(--success); }
.seg-ip { background: var(--primary); }
.seg-blocked { background: var(--error); }
.seg-todo { background: var(--stone); }
.team-stats { display: flex; gap: 12px; font-size: 12px; color: var(--slate); margin-top: 6px; }
.team-stats span { display: flex; align-items: center; gap: 4px; }
.team-stats .dot { width: 6px; height: 6px; border-radius: var(--r-full); }

/* ═══ WS Bar Chart ═══ */
.ws-chart { display: flex; align-items: flex-end; gap: 12px; padding: 20px; height: 200px; }
.ws-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.ws-bar { width: 100%; border-radius: var(--r-xs) var(--r-xs) 0 0; transition: height 0.3s; min-height: 4px; }
.ws-bar-label { font-size: 11px; font-weight: 600; color: var(--slate); }
.ws-bar-count { font-size: 13px; font-weight: 700; color: var(--ink); }

/* ═══ Deadline strip ═══ */
.deadline-strip { padding: 16px 20px; }
.deadline-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline-soft); }
.deadline-item:last-child { border-bottom: none; }
.deadline-date { font-size: 12px; font-weight: 600; min-width: 60px; }
.deadline-text { font-size: 13px; color: var(--charcoal); flex: 1; }
.deadline-ws { margin-left: auto; }

/* ═══ Completions ═══ */
.completion-list { padding: 16px 20px; }
.completion-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.completion-check { color: var(--success); font-weight: 700; }
.completion-id { color: var(--steel); font-size: 12px; font-weight: 500; }

/* ═══ Two col ═══ */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }

/* ═══ Loading ═══ */
.loading { text-align: center; padding: 40px; font-size: 14px; color: var(--steel); }
.spinner { width: 24px; height: 24px; border: 3px solid var(--hairline); border-top-color: var(--primary); border-radius: var(--r-full); animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══ Footer ═══ */
.footer { text-align: center; padding: 24px 0 40px; font-size: 12px; color: var(--steel); }

/* ═══ Responsive ═══ */
@media (max-width: 1023px) { .three-col { grid-template-columns: 1fr; } .two-col { grid-template-columns: 1fr; } }
@media (max-width: 767px) { .page { padding: 0 16px; } .hero-inner { flex-direction: column; gap: 16px; text-align: center; } .hero h1 { font-size: 28px; } .hero-nav { justify-content: center; } .actions-table-wrap { overflow-x: auto; } .actions-table { min-width: 800px; } }
</style>
</head>
<body>

<!-- ═══ HERO ═══ -->
<section class="hero">
  <div class="hero-inner">
    <div>
      <h1>PM Operations</h1>
      <p class="subtitle" id="hero-date">Loading...</p>
    </div>
    <nav class="hero-nav">
      <a href="index.html">📊 L1 Executive</a>
      <a href="ops.html" class="active">⚙️ L2 Operations</a>
      <a href="deep.html">🔬 L3 Deep Dive</a>
    </nav>
  </div>
</section>

<div class="page">

  <!-- ═══ DEADLINE STRIP + TEAM LOAD ═══ -->
  <div class="two-col">
    <div>
      <h2 class="section-title">⏰ 마감 임박 (7일 이내)</h2>
      <div class="card">
        <div class="deadline-strip" id="deadline-strip">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
    <div>
      <h2 class="section-title">👥 담당자별 부하</h2>
      <div class="card">
        <div class="team-grid" id="team-grid">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ WS ISSUE COUNT BAR CHART ═══ -->
  <h2 class="section-title">📊 WS별 이슈 카운트</h2>
  <div class="card">
    <div class="ws-chart" id="ws-chart">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ═══ ACTIONS TABLE ═══ -->
  <h2 class="section-title">📋 전체 액션 아이템 <span id="action-count" style="font-size:14px;color:var(--steel);font-weight:400;margin-left:8px;"></span></h2>
  <div class="card actions-table-wrap">
    <table class="actions-table">
      <thead>
        <tr>
          <th style="width:6%">P</th>
          <th style="width:12%">WS</th>
          <th style="width:32%">제목</th>
          <th style="width:10%">담당</th>
          <th style="width:12%">마감</th>
          <th style="width:10%">상태</th>
          <th style="width:10%">Linear</th>
        </tr>
      </thead>
      <tbody id="actions-tbody">
        <tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr>
      </tbody>
    </table>
  </div>

  <!-- ═══ RECENT COMPLETIONS ═══ -->
  <h2 class="section-title">✅ 최근 완료 (7일)</h2>
  <div class="card">
    <div class="completion-list" id="completion-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="footer" id="footer">Loading...</div>
</div>

<script>
const SUPABASE_URL = 'https://ldqvreaivjrvrvpitcqx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcXZyZWFpdmpydnJ2cGl0Y3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyOTEzMDYsImV4cCI6MjA3Njg2NzMwNn0.GMpmq4tal4kvcW6_P_LOxCWc8XrVh6LX51sQ2L5WyEQ';

const WS_NAMES = { 1:'①챌린지', 2:'②시딩', 3:'③송선미', 4:'④메디샷', 5:'⑤퍼포먼스', 6:'⑥AI', 7:'⑦보고', 8:'⑧에이징유' };
const WS_COLORS = { 1:'#e74c3c', 2:'#2ecc71', 3:'#9065e0', 4:'#e255a1', 5:'#2383e2', 6:'#e07839', 7:'#9b9a97', 8:'#f5c518' };

async function supaFetch(table, query = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
  });
  return res.json();
}

function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function daysUntil(dateStr) {
  if (!dateStr) return Infinity;
  const d = new Date(dateStr); const now = new Date(); now.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.ceil((d - now) / 86400000);
}

function formatDue(dateStr) {
  if (!dateStr) return '<span class="due-ok">—</span>';
  const days = daysUntil(dateStr);
  const d = new Date(dateStr);
  const label = `${d.getMonth()+1}/${d.getDate()}`;
  if (days < 0) return `<span class="due-overdue">${label} (${Math.abs(days)}일 지남)</span>`;
  if (days <= 3) return `<span class="due-soon">${label} (${days}일)</span>`;
  return `<span class="due-ok">${label}</span>`;
}

// ═══ Renderers ═══

function renderActions(actions) {
  actions.sort((a,b) => a.priority - b.priority || (daysUntil(a.due_date) - daysUntil(b.due_date)));
  document.getElementById('action-count').textContent = `(${actions.length}건)`;
  document.getElementById('actions-tbody').innerHTML = actions.map(a => `
    <tr>
      <td><span class="priority-dot priority-${a.priority}" title="P${a.priority}"></span></td>
      <td><span class="ws-tag ws-${a.ws_id}">${WS_NAMES[a.ws_id] || '?'}</span></td>
      <td style="font-weight:500;color:var(--ink)">${esc(a.title)}</td>
      <td>${esc(a.assignee)}</td>
      <td>${formatDue(a.due_date)}</td>
      <td><span class="badge badge-${a.status}">${a.status === 'in_progress' ? '진행중' : a.status === 'done' ? '완료' : a.status === 'blocked' ? '블로킹' : 'Todo'}</span></td>
      <td>${a.linear_issue_id ? `<a href="${esc(a.linear_url)}" target="_blank">${esc(a.linear_issue_id)}</a>` : '—'}</td>
    </tr>
  `).join('');
}

function renderDeadlines(actions) {
  const upcoming = actions
    .filter(a => a.due_date && a.status !== 'done')
    .sort((a,b) => new Date(a.due_date) - new Date(b.due_date))
    .slice(0, 8);

  const strip = document.getElementById('deadline-strip');
  if (upcoming.length === 0) {
    strip.innerHTML = '<div style="padding:12px;text-align:center;color:var(--steel);">🎉 마감 임박 없음</div>';
    return;
  }
  strip.innerHTML = upcoming.map(a => {
    const days = daysUntil(a.due_date);
    const d = new Date(a.due_date);
    return `
      <div class="deadline-item">
        <span class="deadline-date ${days < 0 ? 'due-overdue' : days <= 3 ? 'due-soon' : 'due-ok'}">${d.getMonth()+1}/${d.getDate()}</span>
        <span class="deadline-text">${esc(a.title)}</span>
        <span class="deadline-ws"><span class="ws-tag ws-${a.ws_id}">${WS_NAMES[a.ws_id]}</span></span>
      </div>
    `;
  }).join('');
}

function renderTeamLoad(team) {
  const grid = document.getElementById('team-grid');
  team.sort((a,b) => b.total_issues - a.total_issues);
  grid.innerHTML = team.map(t => {
    const total = t.total_issues || 1;
    const doneP = (t.done_issues / total * 100).toFixed(0);
    const ipP = (t.in_progress_issues / total * 100).toFixed(0);
    const blockedP = (t.blocked_issues / total * 100).toFixed(0);
    const todoP = Math.max(0, 100 - doneP - ipP - blockedP);
    return `
      <div class="team-card">
        <div class="team-name">${esc(t.assignee)}</div>
        <div class="team-bar-wrap">
          <div class="team-bar">
            <div class="seg seg-done" style="width:${doneP}%"></div>
            <div class="seg seg-ip" style="width:${ipP}%"></div>
            <div class="seg seg-blocked" style="width:${blockedP}%"></div>
            <div class="seg seg-todo" style="width:${todoP}%"></div>
          </div>
          <span style="font-size:13px;font-weight:600;color:var(--ink)">${t.total_issues}건</span>
        </div>
        <div class="team-stats">
          <span><span class="dot" style="background:var(--success)"></span>${t.done_issues} 완료</span>
          <span><span class="dot" style="background:var(--primary)"></span>${t.in_progress_issues} 진행</span>
          <span><span class="dot" style="background:var(--error)"></span>${t.blocked_issues} 블로킹</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderWSChart(actions) {
  const counts = {};
  actions.forEach(a => { counts[a.ws_id] = (counts[a.ws_id] || 0) + 1; });
  const maxCount = Math.max(...Object.values(counts), 1);
  const chart = document.getElementById('ws-chart');
  chart.innerHTML = [1,2,3,4,5,6,7,8].map(id => {
    const c = counts[id] || 0;
    const h = Math.max((c / maxCount) * 140, 4);
    return `
      <div class="ws-bar-col">
        <span class="ws-bar-count">${c}</span>
        <div class="ws-bar" style="height:${h}px;background:${WS_COLORS[id]}"></div>
        <span class="ws-bar-label">${WS_NAMES[id]}</span>
      </div>
    `;
  }).join('');
}

function renderCompletions(completions) {
  const list = document.getElementById('completion-list');
  if (completions.length === 0) {
    list.innerHTML = '<div style="padding:12px;text-align:center;color:var(--steel);">아직 완료 이슈 없음</div>';
    return;
  }
  list.innerHTML = completions.map(c => `
    <div class="completion-item">
      <span class="completion-check">✓</span>
      <span class="completion-id">${esc(c.linear_issue_id)}</span>
      <span>${esc(c.title)}</span>
    </div>
  `).join('');
}

// ═══ Init ═══
async function init() {
  try {
    const [actions, team, completions] = await Promise.all([
      supaFetch('dashboard_actions', '?order=priority,due_date'),
      supaFetch('dashboard_team_load', '?order=total_issues.desc'),
      supaFetch('dashboard_recent_completions', '?order=completed_at.desc&limit=10'),
    ]);

    renderActions(actions);
    renderDeadlines(actions);
    renderTeamLoad(team);
    renderWSChart(actions);
    renderCompletions(completions);

    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('hero-date').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]}) · PM 유언우`;
    document.getElementById('footer').textContent = `BIOFOX PM Ops · Last updated: ${now.toISOString().slice(0,16).replace('T',' ')}`;
  } catch (err) {
    console.error(err);
    document.getElementById('actions-tbody').innerHTML = `<tr><td colspan="7" style="color:var(--error);padding:20px;">❌ ${esc(err.message)}</td></tr>`;
  }
}
init();
</script>
</body>
</html>
