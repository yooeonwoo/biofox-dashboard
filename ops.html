<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOFOX PM Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2383e2; --brand-navy: #191919; --brand-navy-mid: #2b2b2b;
  --brand-pink: #e255a1; --brand-orange: #e07839; --brand-purple: #9065e0;
  --brand-teal: #2eaadc; --brand-green: #4dab5c; --tint-yellow-bold: #f5c518;
  --tint-mint: #e0f5ed; --tint-lavender: #ede4f7; --tint-peach: #fdeae1;
  --tint-sky: #dbeafe; --tint-gray: #f1f1ef; --tint-rose: #fce4ec;
  --canvas: #ffffff; --surface: #f7f6f3; --surface-soft: #fafaf8;
  --hairline: #e9e9e7; --hairline-soft: #f0f0ee; --hairline-strong: #d3d3d0;
  --ink-deep: #0f0f0f; --ink: #1a1a1a; --charcoal: #37352f;
  --slate: #6b6b6b; --steel: #9b9a97; --stone: #afafad;
  --on-dark: #ffffff; --on-dark-muted: rgba(255,255,255,0.65);
  --success: #2ecc71; --warning: #e67e22; --error: #e74c3c;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
  --shadow-card: rgba(15,15,15,0.08) 0px 4px 12px 0px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--surface);color:var(--charcoal);line-height:1.55;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding:0 32px}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}

/* Hero */
.hero{background:var(--brand-navy-mid);color:var(--on-dark);padding:48px 0 40px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:16px;right:60px;width:10px;height:10px;background:var(--brand-teal);border-radius:var(--r-full);box-shadow:-30px 20px 0 var(--brand-pink),-80px -5px 0 var(--tint-yellow-bold),50px 40px 0 var(--brand-purple),100px -15px 0 var(--brand-green)}
.hero-inner{max-width:1280px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.hero h1{font-size:36px;font-weight:600;line-height:1.15;letter-spacing:-0.5px}
.hero .subtitle{font-size:14px;color:var(--on-dark-muted);margin-top:4px}
.hero-nav{display:flex;gap:8px}
.hero-nav a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-md);font-size:13px;font-weight:500;color:var(--on-dark);border:1px solid rgba(255,255,255,0.15);transition:background .15s}
.hero-nav a:hover{background:rgba(255,255,255,0.08);text-decoration:none}
.hero-nav a.active{background:var(--primary);border-color:var(--primary)}

.section-title{font-size:20px;font-weight:600;color:var(--ink);margin:32px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card);margin-bottom:24px;overflow:hidden}

/* Grids */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.four-col{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}

/* ═══ Pipeline ═══ */
.pipeline{display:flex;gap:0;padding:20px}
.pipeline-stage{flex:1;text-align:center;position:relative;padding:20px 12px}
.pipeline-stage::after{content:'→';position:absolute;right:-8px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--stone)}
.pipeline-stage:last-child::after{display:none}
.pipeline-count{font-size:36px;font-weight:700;line-height:1.1}
.pipeline-label{font-size:12px;font-weight:600;color:var(--steel);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.pipeline-bar{height:6px;border-radius:var(--r-full);margin-top:8px}

/* ═══ Risk Summary ═══ */
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px}
.risk-card{border-radius:var(--r-md);padding:16px;text-align:center}
.risk-val{font-size:28px;font-weight:700;line-height:1.1}
.risk-label{font-size:12px;font-weight:600;margin-top:4px}
.risk-desc{font-size:11px;margin-top:4px;opacity:.7}

/* ═══ Calendar ═══ */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:20px}
.cal-day{border-radius:var(--r-md);padding:10px 8px;min-height:100px;border:1px solid var(--hairline);background:var(--canvas)}
.cal-day.today{border:2px solid var(--primary);background:var(--tint-sky)}
.cal-day.past{opacity:.5}
.cal-day-header{font-size:11px;font-weight:600;color:var(--steel);margin-bottom:6px;display:flex;justify-content:space-between}
.cal-day-header .day-name{text-transform:uppercase}
.cal-day-header .day-num{color:var(--ink)}
.cal-item{font-size:10px;padding:2px 6px;border-radius:var(--r-xs);margin-bottom:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-item.p1{background:#fce4e4;color:#a0232a}
.cal-item.p2{background:#fef3e2;color:#9a5b13}
.cal-item.p3{background:var(--tint-sky);color:#1a5fa0}
.cal-more{font-size:10px;color:var(--steel);margin-top:2px}

/* ═══ WS Completion Bars ═══ */
.ws-bars{padding:16px 20px}
.ws-bar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline-soft)}
.ws-bar-row:last-child{border-bottom:none}
.ws-bar-name{font-size:13px;font-weight:500;min-width:100px;display:flex;align-items:center;gap:6px}
.ws-bar-track{flex:1;height:8px;background:var(--hairline);border-radius:var(--r-full);overflow:hidden;display:flex}
.ws-bar-track .seg{height:100%}
.seg-done{background:var(--success)}.seg-ip{background:var(--primary)}.seg-blocked{background:var(--error)}.seg-todo{background:#d4d4d4}
.ws-bar-stats{font-size:12px;color:var(--slate);min-width:80px;text-align:right}

/* ═══ Deadline strip ═══ */
.deadline-strip{padding:16px 20px}
.deadline-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--hairline-soft)}
.deadline-item:last-child{border-bottom:none}
.deadline-date{font-size:12px;font-weight:600;min-width:60px}
.deadline-text{font-size:13px;color:var(--charcoal);flex:1}
.deadline-ws{margin-left:auto}
.due-overdue{color:var(--error);font-weight:600}.due-soon{color:var(--warning);font-weight:500}.due-ok{color:var(--slate)}
.ws-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-sm);display:inline-block}
.ws-1{background:#fce4e4;color:#a0232a}.ws-2{background:var(--tint-mint);color:#1a7a3a}.ws-3{background:var(--tint-lavender);color:#6b4fa0}.ws-4{background:var(--tint-rose);color:#9a3055}.ws-5{background:var(--tint-sky);color:#1a5fa0}.ws-6{background:var(--tint-peach);color:#9a5b13}.ws-7{background:var(--tint-gray);color:var(--slate)}.ws-8{background:#fef9e7;color:#8a6d00}

/* ═══ Actions Table ═══ */
.actions-table{width:100%;border-collapse:collapse}
.actions-table thead th{background:var(--surface);padding:10px 14px;font-size:11px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1px solid var(--hairline)}
.actions-table tbody td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--hairline-soft);vertical-align:middle}
.actions-table tbody tr:last-child td{border-bottom:none}
.actions-table tbody tr:hover{background:var(--surface-soft)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:600}
.badge-todo{background:var(--tint-gray);color:var(--slate)}.badge-in_progress{background:var(--tint-sky);color:#1a5fa0}.badge-done{background:#e6f9ee;color:#1a7a3a}.badge-blocked{background:#fce4e4;color:#a0232a}
.priority-dot{width:8px;height:8px;border-radius:var(--r-full);display:inline-block}
.priority-1{background:var(--error)}.priority-2{background:var(--warning)}.priority-3{background:var(--primary)}.priority-4{background:var(--stone)}

/* ═══ Completions ═══ */
.completion-list{padding:16px 20px}
.completion-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.completion-check{color:var(--success);font-weight:700}
.completion-id{color:var(--steel);font-size:12px;font-weight:500}

/* Loading & Footer */
.loading{text-align:center;padding:40px;font-size:14px;color:var(--steel)}
.spinner{width:24px;height:24px;border:3px solid var(--hairline);border-top-color:var(--primary);border-radius:var(--r-full);animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:24px 0 40px;font-size:12px;color:var(--steel)}

@media(max-width:1023px){.two-col,.three-col{grid-template-columns:1fr}.four-col{grid-template-columns:1fr 1fr}.cal-week{grid-template-columns:repeat(4,1fr)}}
@media(max-width:767px){.page{padding:0 16px}.hero-inner{flex-direction:column;gap:16px;text-align:center}.hero h1{font-size:28px}.hero-nav{justify-content:center;flex-wrap:wrap}.pipeline{flex-direction:column;gap:8px}.pipeline-stage::after{display:none}.risk-grid{grid-template-columns:1fr}.four-col{grid-template-columns:1fr}.cal-week{grid-template-columns:repeat(2,1fr)}.actions-table-wrap{overflow-x:auto}.actions-table{min-width:800px}}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div><h1>PM Operations</h1><p class="subtitle" id="hero-date">Loading...</p></div>
    <div style="display:flex;align-items:center;gap:16px">
      <nav class="hero-nav">
        <a href="index.html">📊 L1 Executive</a>
        <a href="ops.html" class="active">⚙️ L2 Operations</a>
        <a href="deep.html">🔬 L3 Deep Dive</a>
      </nav>
      <button id="sync-btn" onclick="syncLinear()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-md);font-size:13px;font-weight:600;color:var(--on-dark);background:var(--brand-purple);border:none;cursor:pointer;transition:all .15s;white-space:nowrap">
        <span id="sync-icon">🔄</span> Linear 동기화
      </button>
    </div>
  </div>
</section>

<div class="page">
  <!-- ROW 1: Pipeline + Risk -->
  <div class="two-col">
    <div>
      <h2 class="section-title">📊 상태 파이프라인</h2>
      <div class="card"><div class="pipeline" id="pipeline"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
    <div>
      <h2 class="section-title">🔥 리스크 서머리</h2>
      <div class="card"><div class="risk-grid" id="risk-grid"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
  </div>

  <!-- ROW 2: Deadline + WS Completion -->
  <div class="two-col">
    <div>
      <h2 class="section-title">⏰ 마감 임박 (7일 이내)</h2>
      <div class="card"><div class="deadline-strip" id="deadline-strip"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
    <div>
      <h2 class="section-title">📈 WS별 완료율</h2>
      <div class="card"><div class="ws-bars" id="ws-bars"><div class="loading"><div class="spinner"></div></div></div></div>
    </div>
  </div>

  <!-- ROW 3: Weekly Calendar -->
  <h2 class="section-title">📅 이번 주 캘린더</h2>
  <div class="card"><div class="cal-week" id="cal-week"><div class="loading"><div class="spinner"></div></div></div></div>

  <!-- ROW 4: Actions Table -->
  <h2 class="section-title">📋 전체 액션 아이템 <span id="action-count" style="font-size:14px;color:var(--steel);font-weight:400;margin-left:8px"></span></h2>
  <div class="card actions-table-wrap">
    <table class="actions-table">
      <thead><tr><th style="width:5%">P</th><th style="width:11%">WS</th><th style="width:33%">제목</th><th style="width:9%">담당</th><th style="width:12%">마감</th><th style="width:10%">상태</th><th style="width:10%">Linear</th></tr></thead>
      <tbody id="actions-tbody"><tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr></tbody>
    </table>
  </div>

  <!-- ROW 5: Completions -->
  <h2 class="section-title">✅ 최근 완료 (7일)</h2>
  <div class="card"><div class="completion-list" id="completion-list"><div class="loading"><div class="spinner"></div></div></div></div>

  <div class="footer" id="footer">Loading...</div>
</div>

<script>
const SB_URL='https://ldqvreaivjrvrvpitcqx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcXZyZWFpdmpydnJ2cGl0Y3F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyOTEzMDYsImV4cCI6MjA3Njg2NzMwNn0.GMpmq4tal4kvcW6_P_LOxCWc8XrVh6LX51sQ2L5WyEQ';
const WS_NAMES={1:'①챌린지',2:'②시딩',3:'③송선미',4:'④메디샷',5:'⑤퍼포먼스',6:'⑥AI',7:'⑦보고',8:'⑧에이징유'};
const WS_ICONS={1:'🔥',2:'🌱',3:'⭐',4:'💉',5:'📈',6:'🤖',7:'📋',8:'📺'};
const DAY_NAMES=['일','월','화','수','목','금','토'];

async function sf(t,q=''){const r=await fetch(`${SB_URL}/rest/v1/${t}${q}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});return r.json();}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}
function du(d){if(!d)return Infinity;const a=new Date(d),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.ceil((a-b)/864e5);}
function fmtDue(d){if(!d)return'<span class="due-ok">—</span>';const days=du(d),dt=new Date(d),l=`${dt.getMonth()+1}/${dt.getDate()}`;if(days<0)return`<span class="due-overdue">${l} (${Math.abs(days)}일 지남)</span>`;if(days<=3)return`<span class="due-soon">${l} (${days}일)</span>`;return`<span class="due-ok">${l}</span>`;}

// ═══ 1. Pipeline ═══
function renderPipeline(actions){
  const el=document.getElementById('pipeline');
  const todo=actions.filter(a=>a.status==='todo').length;
  const ip=actions.filter(a=>a.status==='in_progress').length;
  const blocked=actions.filter(a=>a.status==='blocked').length;
  const done=actions.filter(a=>a.status==='done').length;
  const total=actions.length||1;

  const stages=[
    {label:'Todo',count:todo,color:'var(--stone)',bg:'var(--tint-gray)'},
    {label:'진행중',count:ip,color:'var(--primary)',bg:'var(--tint-sky)'},
    {label:'블로킹',count:blocked,color:'var(--error)',bg:'#fce4e4'},
    {label:'완료',count:done,color:'var(--success)',bg:'#e6f9ee'}
  ];
  el.innerHTML=stages.map(s=>`
    <div class="pipeline-stage">
      <div class="pipeline-count" style="color:${s.color}">${s.count}</div>
      <div class="pipeline-label">${s.label}</div>
      <div class="pipeline-bar" style="background:${s.bg}"><div style="width:${(s.count/total*100).toFixed(0)}%;height:100%;background:${s.color};border-radius:var(--r-full)"></div></div>
    </div>
  `).join('');
}

// ═══ 2. Risk Summary ═══
function renderRisk(actions){
  const el=document.getElementById('risk-grid');
  const active=actions.filter(a=>a.status!=='done');
  const overdue=active.filter(a=>a.due_date&&du(a.due_date)<0).length;
  const blocked=active.filter(a=>a.status==='blocked').length;
  const noDue=active.filter(a=>!a.due_date).length;

  const riskScore=overdue*3+blocked*5+Math.floor(noDue*0.5);
  let riskColor,riskBg,riskLabel;
  if(riskScore>=10){riskColor='#a0232a';riskBg='#fce4e4';riskLabel='🚨 높음';}
  else if(riskScore>=5){riskColor='#9a5b13';riskBg='#fef3e2';riskLabel='⚠️ 주의';}
  else{riskColor='#1a7a3a';riskBg='#e6f9ee';riskLabel='✅ 양호';}

  el.innerHTML=`
    <div class="risk-card" style="background:${riskBg};color:${riskColor}">
      <div class="risk-val">${overdue}</div>
      <div class="risk-label">마감 지남</div>
      <div class="risk-desc">지금 즉시 처리 필요</div>
    </div>
    <div class="risk-card" style="background:${blocked>0?'#fce4e4':'#e6f9ee'};color:${blocked>0?'#a0232a':'#1a7a3a'}">
      <div class="risk-val">${blocked}</div>
      <div class="risk-label">블로킹</div>
      <div class="risk-desc">다른 작업이 막힘</div>
    </div>
    <div class="risk-card" style="background:${noDue>5?'#fef3e2':'var(--tint-gray)'};color:${noDue>5?'#9a5b13':'var(--slate)'}">
      <div class="risk-val">${noDue}</div>
      <div class="risk-label">마감 미정</div>
      <div class="risk-desc">일정 확정 필요</div>
    </div>
  `;
}

// ═══ 3. Weekly Calendar ═══
function renderCalendar(actions){
  const el=document.getElementById('cal-week');
  const now=new Date();now.setHours(0,0,0,0);
  const dow=now.getDay();
  const monday=new Date(now);monday.setDate(now.getDate()-(dow===0?6:dow-1));

  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const dStr=d.toISOString().slice(0,10);
    const isToday=d.getTime()===now.getTime();
    const isPast=d<now;
    const dayItems=actions.filter(a=>a.due_date===dStr&&a.status!=='done');
    dayItems.sort((a,b)=>a.priority-b.priority);
    const show=dayItems.slice(0,3);
    const more=dayItems.length-show.length;

    html+=`<div class="cal-day${isToday?' today':''}${isPast&&!isToday?' past':''}">
      <div class="cal-day-header">
        <span class="day-name">${DAY_NAMES[d.getDay()]}</span>
        <span class="day-num">${d.getMonth()+1}/${d.getDate()}</span>
      </div>
      ${show.map(a=>`<div class="cal-item p${a.priority}" title="${esc(a.title)}">${esc(a.title)}</div>`).join('')}
      ${more>0?`<div class="cal-more">+${more}건 더</div>`:''}
      ${dayItems.length===0?`<div style="font-size:10px;color:var(--stone);padding:8px 0">—</div>`:''}
    </div>`;
  }
  el.innerHTML=html;
}

// ═══ 4. WS Completion Bars ═══
function renderWSBars(actions){
  const el=document.getElementById('ws-bars');
  el.innerHTML=[1,2,3,4,5,6,7,8].map(id=>{
    const items=actions.filter(a=>a.ws_id===id);
    const total=items.length||1;
    const done=items.filter(a=>a.status==='done').length;
    const ip=items.filter(a=>a.status==='in_progress').length;
    const blocked=items.filter(a=>a.status==='blocked').length;
    const todo=items.length-done-ip-blocked;
    return`<div class="ws-bar-row">
      <span class="ws-bar-name">${WS_ICONS[id]} ${WS_NAMES[id]}</span>
      <div class="ws-bar-track">
        <div class="seg seg-done" style="width:${done/total*100}%"></div>
        <div class="seg seg-ip" style="width:${ip/total*100}%"></div>
        <div class="seg seg-blocked" style="width:${blocked/total*100}%"></div>
        <div class="seg seg-todo" style="width:${todo/total*100}%"></div>
      </div>
      <span class="ws-bar-stats">${done}/${items.length} 완료</span>
    </div>`;
  }).join('');
}

// ═══ 5. Deadline Strip ═══
function renderDeadlines(actions){
  const strip=document.getElementById('deadline-strip');
  const upcoming=actions.filter(a=>a.due_date&&a.status!=='done').sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)).slice(0,10);
  if(!upcoming.length){strip.innerHTML='<div style="padding:12px;text-align:center;color:var(--steel)">🎉 마감 임박 없음</div>';return;}
  strip.innerHTML=upcoming.map(a=>{
    const days=du(a.due_date),d=new Date(a.due_date);
    return`<div class="deadline-item">
      <span class="deadline-date ${days<0?'due-overdue':days<=3?'due-soon':'due-ok'}">${d.getMonth()+1}/${d.getDate()}</span>
      <span class="deadline-text">${esc(a.title)}</span>
      <span class="deadline-ws"><span class="ws-tag ws-${a.ws_id}">${WS_NAMES[a.ws_id]}</span></span>
    </div>`;
  }).join('');
}

// ═══ 6. Actions Table ═══
function renderActions(actions){
  actions.sort((a,b)=>a.priority-b.priority||(du(a.due_date)-du(b.due_date)));
  document.getElementById('action-count').textContent=`(${actions.length}건)`;
  const sm={todo:'Todo',in_progress:'진행중',done:'완료',blocked:'블로킹'};
  document.getElementById('actions-tbody').innerHTML=actions.map(a=>`
    <tr>
      <td><span class="priority-dot priority-${a.priority}" title="P${a.priority}"></span></td>
      <td><span class="ws-tag ws-${a.ws_id}">${WS_NAMES[a.ws_id]||'?'}</span></td>
      <td style="font-weight:500;color:var(--ink)">${esc(a.title)}</td>
      <td>${esc(a.assignee)}</td>
      <td>${fmtDue(a.due_date)}</td>
      <td><span class="badge badge-${a.status}">${sm[a.status]||a.status}</span></td>
      <td>${a.linear_issue_id?`<a href="${esc(a.linear_url)}" target="_blank">${esc(a.linear_issue_id)}</a>`:'—'}</td>
    </tr>
  `).join('');
}

// ═══ 7. Completions ═══
function renderCompletions(completions){
  const el=document.getElementById('completion-list');
  if(!completions.length){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--steel)">아직 완료 이슈 없음</div>';return;}
  el.innerHTML=completions.map(c=>`<div class="completion-item"><span class="completion-check">✓</span><span class="completion-id">${esc(c.linear_issue_id)}</span><span>${esc(c.title)}</span></div>`).join('');
}

// ═══ Init ═══
async function init(){
  try{
    const[actions,completions]=await Promise.all([
      sf('dashboard_actions','?order=priority,due_date'),
      sf('dashboard_recent_completions','?order=completed_at.desc&limit=10'),
    ]);
    renderPipeline(actions);
    renderRisk(actions);
    renderDeadlines(actions);
    renderWSBars(actions);
    renderCalendar(actions);
    renderActions(actions);
    renderCompletions(completions);

    const now=new Date();
    document.getElementById('hero-date').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAY_NAMES[now.getDay()]}) · PM 유언우`;
    document.getElementById('footer').textContent=`BIOFOX PM Ops · Last updated: ${now.toISOString().slice(0,16).replace('T',' ')}`;
  }catch(err){
    console.error(err);
    document.getElementById('pipeline').innerHTML=`<div style="color:var(--error);padding:20px">❌ ${esc(err.message)}</div>`;
  }
}
init();

// ═══ Sync Button ═══
async function syncLinear(){
  const btn=document.getElementById('sync-btn');
  const icon=document.getElementById('sync-icon');
  btn.disabled=true;
  btn.style.opacity='0.6';
  icon.style.animation='spin 0.8s linear infinite';
  icon.textContent='⏳';

  try{
    // Re-fetch all data from Supabase
    const[actions,completions]=await Promise.all([
      sf('dashboard_actions','?order=priority,due_date'),
      sf('dashboard_recent_completions','?order=completed_at.desc&limit=10'),
    ]);
    renderPipeline(actions);
    renderRisk(actions);
    renderDeadlines(actions);
    renderWSBars(actions);
    renderCalendar(actions);
    renderActions(actions);
    renderCompletions(completions);

    // Update timestamp
    const now=new Date();
    const ts=`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    document.getElementById('footer').textContent=`BIOFOX PM Ops · Synced: ${ts} · Linear 데이터 변경은 PM에게 요청`;

    icon.textContent='✅';
    icon.style.animation='none';
    setTimeout(()=>{icon.textContent='🔄';btn.disabled=false;btn.style.opacity='1';},2000);
  }catch(err){
    icon.textContent='❌';
    icon.style.animation='none';
    alert('동기화 실패: '+err.message);
    setTimeout(()=>{icon.textContent='🔄';btn.disabled=false;btn.style.opacity='1';},2000);
  }
}
</script>
